<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monoprix vs Grand Frais</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F7F3EA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Comparateur" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --ink: #20281F;
    --paper: #F7F3EA;
    --mono: #C4297A;
    --gf: #3F6B33;
    --tag: #D98A2B;
    --warn: #B23A2B;
    --promo: #C4297A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  .sans { font-family: system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 70px; }
  h1 { font-size: 28px; margin: 4px 0 0; font-weight: 600; }
  h1 .m { color: var(--mono); }
  h1 .g { color: var(--gf); }
  .eyebrow { font-size: 12.5px; letter-spacing: .5px; color: rgba(32,40,31,.6); }
  .sub { font-size: 14px; color: rgba(32,40,31,.8); margin-top: 8px; max-width: 480px; }
  .row { display: flex; gap: 10px; }
  .card { background: #fff; border: 1px solid rgba(32,40,31,.08); border-radius: 10px; padding: 14px 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: system-ui, sans-serif; }
  .btn-dark { background: var(--ink); color: var(--paper); width: 100%; }
  .btn-outline { background: #fff; border: 1px solid rgba(32,40,31,.2); color: var(--ink); }
  input[type=text], input.price, select {
    width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid rgba(32,40,31,.18);
    font-size: 14.5px; font-family: system-ui, sans-serif; background: var(--paper); color: var(--ink);
  }
  label.small { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
  .field { flex: 1; min-width: 0; }
  .store-block { border: 1px solid rgba(32,40,31,.12); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .store-block .store-title { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; font-family: system-ui, sans-serif; }
  .grid-prices { display: grid; grid-template-columns: 1fr auto auto; row-gap: 10px; column-gap: 10px; font-family: system-ui, sans-serif; align-items: start; }
  .name-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 14px; font-weight: 600; background: #fff; border: 1px solid rgba(32,40,31,.08); border-radius: 8px; padding: 10px 12px; }
  .badge { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(32,40,31,.08); min-width: 128px; background: #fff; }
  .badge.win { background: rgba(0,0,0,.03); }
  .badge-top { display: flex; align-items: center; gap: 8px; }
  .badge .dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
  .badge .lbl { font-size: 10.5px; font-weight: 600; line-height: 1.2; }
  .badge .val { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .badge .old-price { font-size: 10.5px; text-decoration: line-through; color: rgba(32,40,31,.45); font-weight: 500; margin-right: 4px; }
  .promo-flag { display: inline-block; font-size: 9.5px; font-weight: 700; color: #fff; background: var(--promo); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: middle; }
  .prod-card { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .prod-top { display: flex; justify-content: space-between; align-items: center; }
  .del { border: none; background: transparent; color: rgba(32,40,31,.45); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .pill { text-align: center; }
  .pill .lbl { font-size: 11px; font-weight: 600; }
  .pill .val { font-size: 14px; font-weight: 700; }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .meta-tag { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: rgba(32,40,31,.06); color: var(--ink); }
  .unit-suffix { font-size: 10.5px; font-weight: 600; color: rgba(32,40,31,.55); margin-left: 2px; }
  .analysis { margin-top: 4px; padding-top: 10px; border-top: 1px dashed rgba(32,40,31,.15); font-family: system-ui, sans-serif; font-size: 12.5px; }
  .analysis .title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .note { font-size: 12.5px; color: rgba(32,40,31,.65); }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; font-family: system-ui, sans-serif; }
  .action-item { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 10px; background: var(--paper); border-radius: 6px; margin-bottom: 6px; font-family: system-ui, sans-serif; }
  ul.levers { margin: 0; padding-left: 18px; font-family: system-ui, sans-serif; font-size: 13.5px; }
  ul.levers li { margin-bottom: 6px; }
  .top-actions { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .export-col { display: flex; flex-direction: column; gap: 8px; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .wrap { padding: 0 !important; }
    .prices-only .hide-in-prices-only { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
const STORAGE_KEY = "cp_products_v2";
const MARGIN_KEY = "cp_min_margin_v1";

function defaultStore(prix, promo, calibre, origine, unit) {
  return { prix, promo: promo || "", calibre: calibre || "", origine: origine || "", unit: unit || "piece" };
}

let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || [
  { id: 1, name: "Lait demi-écrémé 1L", achat: "0.72",
    monoprix: defaultStore("1.15", "", "", "France", "piece"),
    grandfrais: defaultStore("0.99", "", "", "France", "piece") },
  { id: 2, name: "Beurre doux 250g", achat: "1.95",
    monoprix: defaultStore("2.85", "2.49", "", "France", "piece"),
    grandfrais: defaultStore("2.40", "", "", "France", "piece") },
  { id: 3, name: "Tomates grappe", achat: "2.10",
    monoprix: defaultStore("3.90", "", "Calibre 57-67", "Maroc", "kg"),
    grandfrais: defaultStore("2.95", "2.49", "Calibre 47-57", "France", "kg") },
  { id: 4, name: "Poulet fermier", achat: "6.60",
    monoprix: defaultStore("9.50", "", "Gros calibre", "Côte d'Ivoire", "piece"),
    grandfrais: defaultStore("7.80", "", "Calibre moyen", "Côte d'Ivoire", "piece") },
];
let minMargin = localStorage.getItem(MARGIN_KEY) || "15";
let printMode = "full";

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  localStorage.setItem(MARGIN_KEY, minMargin);
}

function num(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) ? n : null;
}
function euro(v) {
  const n = num(v);
  return n === null ? "—" : n.toFixed(2).replace(".", ",") + " €";
}
function pct(v) {
  return v.toFixed(1).replace(".", ",") + " %";
}
function unitLabel(unit) {
  return unit === "kg" ? "/kg" : "/pièce";
}
// Prix réellement appliqué : le prix promo s'il est renseigné et valide, sinon le prix normal.
function effectivePrice(store) {
  const promo = num(store.promo);
  if (promo !== null && promo > 0) return promo;
  return num(store.prix);
}
function isOnPromo(store) {
  const promo = num(store.promo);
  return promo !== null && promo > 0;
}

function computeAnalysis(p, minMarginPct) {
  const achat = num(p.achat);
  const venteEff = effectivePrice(p.monoprix);
  const gfEff = effectivePrice(p.grandfrais);
  if (achat === null || venteEff === null || achat <= 0 || venteEff <= 0) return null;
  const margeActuelle = ((venteEff - achat) / venteEff) * 100;
  const prixPlancher = achat / (1 - minMarginPct / 100);
  let ecartVsGF = null, prixConseille = null, margeConseillee = null, atteignable = null;
  if (gfEff !== null && gfEff > 0) {
    ecartVsGF = ((venteEff - gfEff) / venteEff) * 100;
    if (prixPlancher <= gfEff) {
      prixConseille = gfEff;
      margeConseillee = ((gfEff - achat) / gfEff) * 100;
      atteignable = true;
    } else {
      prixConseille = prixPlancher;
      margeConseillee = minMarginPct;
      atteignable = false;
    }
  }
  return { achat, venteEff, gfEff, margeActuelle, prixPlancher, ecartVsGF, prixConseille, margeConseillee, atteignable };
}

const LEVERS = [
  "Réduire la démarque et la casse sur le frais (rotation, contrôle des dates)",
  "Mettre en tête de gondole ou en zone chaude les produits où l'écart est faible",
  "Utiliser le budget promo local (ILV, offre ponctuelle) sur les produits les plus comparés",
  "Soigner la présentation et la fraîcheur perçue pour justifier l'écart aux yeux du client",
  "Constituer un dossier chiffré à remonter aux achats / category manager",
];

function exportPdf(mode) {
  printMode = mode;
  document.getElementById("root").className = mode === "prices" ? "prices-only" : "";
  setTimeout(() => window.print(), 50);
}

function removeProduct(id) {
  products = products.filter(p => p.id !== id);
  save();
  render();
}

function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

function addProduct() {
  const name = val("f-name").trim();
  const achat = val("f-achat");
  const mpPrix = val("f-mp-prix");
  const gfPrix = val("f-gf-prix");
  if (!name || !achat || !mpPrix || !gfPrix) return;

  products.push({
    id: Date.now(),
    name,
    achat,
    monoprix: defaultStore(mpPrix, val("f-mp-promo"), val("f-mp-calibre").trim(), val("f-mp-origine").trim(), val("f-mp-unit")),
    grandfrais: defaultStore(gfPrix, val("f-gf-promo"), val("f-gf-calibre").trim(), val("f-gf-origine").trim(), val("f-gf-unit")),
  });
  save();
  ["f-name","f-achat","f-mp-prix","f-mp-promo","f-mp-calibre","f-mp-origine","f-gf-prix","f-gf-promo","f-gf-calibre","f-gf-origine"]
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  render();
}

function onMarginChange(v) {
  minMargin = v;
  save();
  render();
}

function storeTagsHtml(store) {
  const tags = [store.calibre, store.origine].filter(Boolean).map(t => `<span class="meta-tag">${t}</span>`);
  return tags.length ? `<div class="meta-tags">${tags.join("")}</div>` : "";
}

function badgeHtml(brand, store, highlight) {
  const isMono = brand === "monoprix";
  const color = isMono ? "var(--mono)" : "var(--gf)";
  const label = isMono ? "Monoprix" : "Grand Frais";
  const initial = isMono ? "M" : "GF";
  const onPromo = isOnPromo(store);
  const priceHtml = onPromo
    ? `<span class="old-price">${euro(store.prix)}</span>${euro(store.promo)}`
    : euro(store.prix);
  return `<div class="badge ${highlight ? "win" : ""}" style="${highlight ? `border-color:${color}55;` : ""}">
    <div class="badge-top">
      <div class="dot" style="background:${color};">${initial}</div>
      <div><div class="lbl" style="color:${color}">${label}${onPromo ? `<span class="promo-flag">PROMO</span>` : ""}</div><div class="val">${priceHtml}<span class="unit-suffix">${unitLabel(store.unit)}</span></div></div>
    </div>
    ${storeTagsHtml(store)}
  </div>`;
}

function storeFormBlock(prefix, storeLabel, color) {
  return `<div class="store-block">
    <div class="store-title sans" style="color:${color};">${storeLabel}</div>
    <div class="row">
      <div class="field"><label class="small sans">Prix normal (€)</label><input type="text" id="${prefix}-prix" placeholder="0.00" inputmode="decimal" /></div>
      <div class="field"><label class="small sans">Prix promo (€)</label><input type="text" id="${prefix}-promo" placeholder="optionnel" inputmode="decimal" /></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <div class="field"><label class="small sans">Calibre</label><input type="text" id="${prefix}-calibre" placeholder="ex. Calibre 3" /></div>
      <div class="field"><label class="small sans">Origine</label><input type="text" id="${prefix}-origine" placeholder="ex. France" /></div>
      <div class="field" style="flex:0 0 110px;">
        <label class="small sans">Vendu</label>
        <select id="${prefix}-unit">
          <option value="piece">pièce</option>
          <option value="kg">kg</option>
        </select>
      </div>
    </div>
  </div>`;
}

function render() {
  const minMarginNum = num(minMargin) ?? 15;
  const analyses = products.map(p => ({ ...p, a: computeAnalysis(p, minMarginNum) }));
  const priorityProducts = analyses
    .filter(p => p.a && p.a.ecartVsGF !== null && p.a.ecartVsGF > 0)
    .sort((x, y) => y.a.ecartVsGF - x.a.ecartVsGF)
    .slice(0, 3);
  const unreachableCount = analyses.filter(p => p.a && p.a.atteignable === false).length;

  let html = "";

  html += `<div class="top-actions">
    <div>
      <div class="eyebrow sans">Comparateur & prix compétitif</div>
      <h1><span class="m">Monoprix</span> vs <span class="g">Grand Frais</span></h1>
      <p class="sub hide-in-prices-only">Renseigne le prix, la promo éventuelle, le calibre, l'origine et l'unité de vente pour chaque enseigne. L'appli calcule ta marge et le prix compétitif en tenant compte des promos actives.</p>
    </div>
    <div class="export-col no-print">
      <button class="btn btn-outline" onclick="exportPdf('full')">📄 PDF complet</button>
      <button class="btn btn-outline" onclick="exportPdf('prices')">📄 PDF (prix)</button>
    </div>
  </div>`;

  html += `<div class="section-title">Grille de prix par enseigne</div>
  <div class="grid-prices" style="margin-bottom:26px;">`;
  if (analyses.length === 0) {
    html += `<div class="sans note" style="grid-column:1/-1;text-align:center;padding:20px 0;">Ajoute un produit ci-dessous.</div>`;
  }
  analyses.forEach(p => {
    const cheaper = p.a && p.a.ecartVsGF !== null ? (p.a.ecartVsGF > 0 ? "grandfrais" : p.a.ecartVsGF < 0 ? "monoprix" : "egal") : null;
    html += `<div class="name-cell"><div>${p.name}</div></div>`;
    html += badgeHtml("monoprix", p.monoprix, cheaper === "monoprix");
    html += badgeHtml("grandfrais", p.grandfrais, cheaper === "grandfrais");
  });
  html += `</div>`;

  html += `<div class="row no-print" style="align-items:center;gap:10px;margin-bottom:18px;font-family:system-ui,sans-serif;">
    <label class="sans" style="font-size:13.5px;color:rgba(32,40,31,.6);">Marge minimale à conserver</label>
    <input type="text" value="${minMargin}" oninput="onMarginChange(this.value)" style="width:56px;text-align:center;padding:6px 8px;" />
    <span class="sans" style="font-size:13.5px;color:rgba(32,40,31,.6);">%</span>
  </div>`;

  html += `<div class="card no-print" style="margin-bottom:24px;">
    <div class="row" style="flex-direction:column;gap:10px;">
      <input type="text" id="f-name" placeholder="Nom du produit" />
      <div class="field"><label class="small sans" style="color:var(--tag);">Prix d'achat (€)</label><input type="text" id="f-achat" placeholder="0.00" inputmode="decimal" /></div>
      ${storeFormBlock("f-mp", "Monoprix", "var(--mono)")}
      ${storeFormBlock("f-gf", "Grand Frais", "var(--gf)")}
      <button class="btn btn-dark" onclick="addProduct()">+ Ajouter le produit</button>
    </div>
  </div>`;

  html += `<div class="hide-in-prices-only">`;
  analyses.forEach(p => {
    const a = p.a;
    html += `<div class="card prod-card">
      <div class="prod-top">
        <div style="font-size:16px;font-weight:600;">${p.name}</div>
        <button class="del no-print" onclick="removeProduct(${p.id})">🗑</button>
      </div>
      <div class="row sans" style="flex-wrap:wrap;gap:16px;">
        <div>
          <div class="lbl sans" style="font-size:11px;font-weight:700;color:var(--mono);margin-bottom:4px;">Monoprix</div>
          <div class="val" style="font-size:14px;font-weight:700;">${isOnPromo(p.monoprix) ? `<span class="old-price">${euro(p.monoprix.prix)}</span>${euro(p.monoprix.promo)}` : euro(p.monoprix.prix)}<span class="unit-suffix">${unitLabel(p.monoprix.unit)}</span></div>
          ${storeTagsHtml(p.monoprix)}
        </div>
        <div>
          <div class="lbl sans" style="font-size:11px;font-weight:700;color:var(--gf);margin-bottom:4px;">Grand Frais</div>
          <div class="val" style="font-size:14px;font-weight:700;">${isOnPromo(p.grandfrais) ? `<span class="old-price">${euro(p.grandfrais.prix)}</span>${euro(p.grandfrais.promo)}` : euro(p.grandfrais.prix)}<span class="unit-suffix">${unitLabel(p.grandfrais.unit)}</span></div>
          ${storeTagsHtml(p.grandfrais)}
        </div>
        <div>
          <div class="lbl sans" style="font-size:11px;font-weight:700;color:var(--tag);margin-bottom:4px;">Achat</div>
          <div class="val" style="font-size:14px;font-weight:700;">${euro(p.achat)}</div>
        </div>
        ${a ? `<div style="margin-left:auto;font-size:13px;color:rgba(32,40,31,.6);align-self:center;">Marge actuelle : <b style="color:var(--ink);">${pct(a.margeActuelle)}</b></div>` : ""}
      </div>
      ${a && a.ecartVsGF !== null ? `
      <div class="analysis">
        <div class="title" style="color:${a.atteignable ? "var(--gf)" : "var(--warn)"};">🎯 Prix conseillé pour être compétitif : ${euro(a.prixConseille)}${unitLabel(p.monoprix.unit)}</div>
        <div class="note">${a.atteignable
          ? `Tu peux t'aligner sur Grand Frais (prix réellement appliqué, promo comprise) et garder une marge de ${pct(a.margeConseillee)}.`
          : `Impossible d'égaler Grand Frais (${euro(a.gfEff)}${unitLabel(p.grandfrais.unit)}, promo comprise) sans passer sous ${minMarginNum}% de marge. À ${euro(a.prixConseille)}, il reste ${pct(((a.prixConseille - a.gfEff) / a.prixConseille) * 100)} plus cher.`}</div>
      </div>` : ""}
    </div>`;
  });
  html += `</div>`;

  if (priorityProducts.length > 0) {
    html += `<div class="card hide-in-prices-only" style="margin-top:6px;">
      <div class="section-title">Plan d'action rayon</div>
      <div class="sans note" style="margin-bottom:10px;">Produits à traiter en priorité (écart après promos) :</div>`;
    priorityProducts.forEach(p => {
      html += `<div class="action-item"><span>${p.name}</span><span style="color:${p.a.atteignable ? "var(--gf)" : "var(--warn)"};font-weight:700;">Objectif : ${euro(p.a.prixConseille)}${unitLabel(p.monoprix.unit)}${p.a.atteignable ? "" : " (marge min.)"}</span></div>`;
    });
    if (unreachableCount > 0) {
      html += `<div class="sans" style="font-size:12.5px;color:var(--warn);background:rgba(178,58,43,.08);border-radius:6px;padding:8px 10px;margin:10px 0;">${unreachableCount} produit(s) ne peuvent pas atteindre le prix Grand Frais sans passer sous la marge minimale — le levier est de renégocier le prix d'achat.</div>`;
    }
    html += `<div class="sans note" style="margin:10px 0;">Leviers activables à ton niveau (chef de rayon) :</div>
      <ul class="levers">${LEVERS.map(l => `<li>${l}</li>`).join("")}</ul>
    </div>`;
  }

  document.getElementById("root").innerHTML = html;
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
