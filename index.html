<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monoprix vs Grand Frais</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#EEF1F4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Comparateur" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --ink: #1A2433;
    --muted: #667085;
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --border: #DDE2E8;
    --mono: #8C3A56;
    --gf: #2F5D45;
    --accent: #1F4E79;
    --tag: #8A6116;
    --warn: #A6432E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    font-size: 14px;
    line-height: 1.45;
  }
  .sans { font-family: inherit; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 70px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .export-col { display: flex; gap: 8px; }
  .row { display: flex; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface); color: var(--ink); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 10px 14px; font-size: 14px; }
  .btn:hover { border-color: var(--accent); }
  input[type=text], select {
    width: 100%; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field { flex: 1; min-width: 0; }

  /* KPI strip */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .kpi .kpi-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .kpi .kpi-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .kpi-value.warn { color: var(--warn); }
  .kpi .kpi-value.good { color: var(--gf); }

  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--accent); }

  /* Price table */
  .price-table { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 22px; background: var(--surface); }
  .price-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .price-row:first-child { border-top: none; }
  .price-row.header { background: #F7F8FA; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .price-row .col-name { flex: 1 1 160px; min-width: 0; }
  .price-row .col-name .pname { font-weight: 600; font-size: 13.5px; }
  .price-row .col-price { flex: 0 0 108px; text-align: right; font-variant-numeric: tabular-nums; }
  .col-price .store-lbl { font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .col-price .store-val { font-size: 14px; font-weight: 700; }
  .col-price.win .store-val { color: var(--gf); }
  .old-price { font-size: 10.5px; text-decoration: line-through; color: var(--muted); font-weight: 500; margin-right: 3px; }
  .promo-flag { display: inline-block; font-size: 9px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 3px; padding: 1px 4px; margin-left: 4px; vertical-align: middle; }
  .unit-suffix { font-size: 10.5px; font-weight: 500; color: var(--muted); margin-left: 1px; }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .meta-tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: #F0F2F5; color: var(--muted); border: 1px solid var(--border); }
  .meta-tag.warn { background: #FBEDE9; color: var(--warn); border-color: #EACFC6; }

  /* Product detail cards */
  .prod-card { border-left: 4px solid var(--border); background: var(--surface); border: 1px solid var(--border); border-left-width: 4px; border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
  .prod-card.status-ok { border-left-color: var(--gf); }
  .prod-card.status-warn { border-left-color: var(--warn); }
  .prod-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .del { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 9px; border-radius: 4px; }
  .stat-block .stat-lbl { font-size: 10.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .stat-block .stat-val { font-size: 14px; font-weight: 700; }
  .analysis { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; }
  .analysis .title { font-weight: 700; font-size: 12.5px; margin-bottom: 3px; }
  .note { font-size: 12.5px; color: var(--muted); }
  .recos { margin: 0; padding-left: 20px; font-size: 13px; }
  .recos li { margin-bottom: 7px; }
  .priority-list { margin: 0 0 12px; padding: 0; list-style: none; counter-reset: prio; }
  .priority-list li { counter-increment: prio; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; background: #F7F8FA; }
  .priority-list li::before { content: counter(prio); flex: 0 0 18px; height: 18px; border-radius: 3px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .warn-banner { font-size: 12px; color: var(--warn); background: #FBEDE9; border: 1px solid #EACFC6; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; }
  .reminder-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--tag); background: #FBF3E2; border: 1px solid #EBD9A8; border-radius: 4px; padding: 9px 12px; margin-bottom: 16px; }
  .reminder-banner .actions { display: flex; gap: 6px; }
  .reminder-banner .actions button { font-size: 11.5px; padding: 4px 9px; }

  /* Chart */
  .chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 12.5px; }
  .chart-label { flex: 0 0 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-bar-wrap { flex: 1; background: #F0F2F5; border-radius: 3px; height: 14px; position: relative; overflow: hidden; }
  .chart-bar { height: 100%; border-radius: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .chart-val { flex: 0 0 54px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .wrap { padding: 0 !important; }
    .prices-only .hide-in-prices-only { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const STORAGE_KEY = "cp_products_v2";
const MARGIN_KEY = "cp_min_margin_v1";
const HISTORY_KEY = "cp_history_v1";

function defaultStore(prix, promo, calibre, origine, unit) {
  return { prix, promo: promo || "", calibre: calibre || "", origine: origine || "", unit: unit || "piece" };
}

let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || [
  { id: 1, name: "Lait demi-écrémé 1L", achat: "0.72",
    monoprix: defaultStore("1.15", "", "", "France", "piece"),
    grandfrais: defaultStore("0.99", "", "", "France", "piece") },
  { id: 2, name: "Beurre doux 250g", achat: "1.95",
    monoprix: defaultStore("2.85", "2.49", "", "France", "piece"),
    grandfrais: defaultStore("2.40", "", "", "France", "piece") },
  { id: 3, name: "Tomates grappe", achat: "2.10",
    monoprix: defaultStore("3.90", "", "Calibre 57-67", "Maroc", "kg"),
    grandfrais: defaultStore("2.95", "2.49", "Calibre 47-57", "France", "kg") },
  { id: 4, name: "Poulet fermier", achat: "6.60",
    monoprix: defaultStore("9.50", "", "Gros calibre", "Côte d'Ivoire", "piece"),
    grandfrais: defaultStore("7.80", "", "Calibre moyen", "Côte d'Ivoire", "piece") },
];
let minMargin = localStorage.getItem(MARGIN_KEY) || "15";
let floorMargin = localStorage.getItem("cp_floor_margin_v1") || "3";
let printMode = "full";
let editingId = null;
let priceHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
let searchQuery = "";
let sortMode = "name";
let categoryFilter = "";
let lastAnalyses = [];
let store3Name = localStorage.getItem("cp_store3_name_v1") || "";
let lastEditDate = localStorage.getItem("cp_last_edit_v1") || "";
let reminderDismissed = false;
if (!lastEditDate) { lastEditDate = new Date().toISOString(); localStorage.setItem("cp_last_edit_v1", lastEditDate); }
let pinHash = localStorage.getItem("cp_pin_v1") || null;
let unlocked = !pinHash;

// Synchronisation cloud (Firebase Firestore) — même principe que Saloni Manager :
// un "code de synchronisation" identique sur chaque appareil relie tous tes appareils
// au même document. Fonctionne en complément du stockage local (localStorage reste
// le mode hors-ligne par défaut).
let firebaseConfig = JSON.parse(localStorage.getItem("cp_firebase_config_v1") || "null");
let syncId = localStorage.getItem("cp_sync_id_v1") || "";
let fbDb = null;
let syncStatus = ""; // "" | "syncing" | "ok" | "error"

function initFirebase() {
  if (!firebaseConfig || !syncId) return false;
  if (typeof firebase === "undefined") { syncStatus = "error"; return false; }
  try {
    if (!fbDb) {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      fbDb = firebase.firestore();
    }
    return true;
  } catch (e) {
    syncStatus = "error";
    return false;
  }
}

function pullFromCloud() {
  if (!initFirebase()) return;
  syncStatus = "syncing";
  fbDb.collection("comparateur_prix").doc(syncId).get().then(doc => {
    if (doc.exists) {
      const data = doc.data();
      if (Array.isArray(data.products)) products = data.products;
      if (data.minMargin) minMargin = data.minMargin;
      if (data.floorMargin) floorMargin = data.floorMargin;
      if (Array.isArray(data.priceHistory)) priceHistory = data.priceHistory;
      if (typeof data.store3Name === "string") store3Name = data.store3Name;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }
    syncStatus = "ok";
    render();
  }).catch(() => { syncStatus = "error"; render(); });
}

function pushToCloud() {
  if (!initFirebase()) return;
  syncStatus = "syncing";
  fbDb.collection("comparateur_prix").doc(syncId).set({
    products, minMargin, floorMargin, priceHistory, store3Name,
    updatedAt: new Date().toISOString(),
  }).then(() => { syncStatus = "ok"; render(); }).catch(() => { syncStatus = "error"; render(); });
}

function configureSync() {
  const configStr = prompt("Colle ici la configuration Firebase (firebaseConfig, au format JSON) :", firebaseConfig ? JSON.stringify(firebaseConfig) : "");
  if (configStr === null) return;
  try {
    firebaseConfig = JSON.parse(configStr);
  } catch (e) {
    alert("JSON invalide — vérifie que tu as bien copié tout l'objet firebaseConfig.");
    return;
  }
  localStorage.setItem("cp_firebase_config_v1", JSON.stringify(firebaseConfig));
  const id = prompt("Choisis un code de synchronisation (à retaper à l'identique sur chaque appareil) :", syncId);
  if (id === null) return;
  syncId = id.trim();
  localStorage.setItem("cp_sync_id_v1", syncId);
  fbDb = null;
  alert("Synchronisation configurée. Récupération des données...");
  pullFromCloud();
}

function disableSync() {
  const ok = confirm("Désactiver la synchronisation cloud sur cet appareil ? Tes données restent en local.");
  if (!ok) return;
  firebaseConfig = null;
  syncId = "";
  fbDb = null;
  syncStatus = "";
  localStorage.removeItem("cp_firebase_config_v1");
  localStorage.removeItem("cp_sync_id_v1");
  render();
}

function manualSync() { pullFromCloud(); }

const CATEGORIES = ["Fruits & Légumes", "Crèmerie", "Boucherie / Volaille", "Poissonnerie", "Épicerie", "Boissons", "Surgelés", "Boulangerie / Pâtisserie", "Autre"];

function getCategorie(p) { return p.categorie || "Autre"; }
function getStore3(p) { return p.store3 || defaultStore("", "", "", "", "piece"); }

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  localStorage.setItem(MARGIN_KEY, minMargin);
  localStorage.setItem("cp_floor_margin_v1", floorMargin);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(priceHistory));
  localStorage.setItem("cp_store3_name_v1", store3Name);
  if (firebaseConfig && syncId) pushToCloud();
}

function touchLastEdit() {
  lastEditDate = new Date().toISOString();
  localStorage.setItem("cp_last_edit_v1", lastEditDate);
}

function num(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) ? n : null;
}
function euro(v) {
  const n = num(v);
  return n === null ? "—" : n.toFixed(2).replace(".", ",") + " €";
}
function pct(v) {
  return v.toFixed(1).replace(".", ",") + " %";
}
function unitLabel(unit) {
  return unit === "kg" ? "/kg" : "/pièce";
}
// Prix réellement appliqué : le prix promo s'il est renseigné et valide, sinon le prix normal.
function effectivePrice(store) {
  const promo = num(store.promo);
  if (promo !== null && promo > 0) return promo;
  return num(store.prix);
}
function isOnPromo(store) {
  const promo = num(store.promo);
  return promo !== null && promo > 0;
}

// Détermine le concurrent le moins cher (Grand Frais, et la 3e enseigne si activée).
function competitorPrice(p) {
  let best = effectivePrice(p.grandfrais);
  let label = "Grand Frais";
  if (store3Name) {
    const s3 = effectivePrice(getStore3(p));
    if (s3 !== null && s3 > 0 && (best === null || s3 < best)) { best = s3; label = store3Name; }
  }
  return { value: best, label };
}

function computeAnalysis(p, minMarginPct) {
  const achat = num(p.achat);
  const venteEff = effectivePrice(p.monoprix);
  const comp = competitorPrice(p);
  const gfEff = comp.value;
  if (achat === null || venteEff === null || achat <= 0 || venteEff <= 0) return null;
  const margeActuelle = ((venteEff - achat) / venteEff) * 100;
  const prixPlancher = achat / (1 - minMarginPct / 100);
  let ecartVsGF = null, prixConseille = null, margeConseillee = null, atteignable = null;
  if (gfEff !== null && gfEff > 0) {
    ecartVsGF = ((venteEff - gfEff) / venteEff) * 100;
    if (prixPlancher <= gfEff) {
      prixConseille = gfEff;
      margeConseillee = ((gfEff - achat) / gfEff) * 100;
      atteignable = true;
    } else {
      prixConseille = prixPlancher;
      margeConseillee = minMarginPct;
      atteignable = false;
    }
  }
  return { achat, venteEff, gfEff, margeActuelle, prixPlancher, ecartVsGF, prixConseille, margeConseillee, atteignable, competitorLabel: comp.label };
}

// Prix plancher absolu : le prix le plus bas possible (marge minimale, ex. 2-3%)
// tout en restant sous le prix du concurrent le moins cher si c'est réalisable.
function computeFloorAnalysis(p, floorPct) {
  const achat = num(p.achat);
  const comp = competitorPrice(p);
  const gfEff = comp.value;
  if (achat === null || achat <= 0) return null;
  const prixPlancherAbsolu = achat / (1 - floorPct / 100);
  let sousGF = null, ecart = null;
  if (gfEff !== null && gfEff > 0) {
    sousGF = prixPlancherAbsolu < gfEff;
    ecart = ((gfEff - prixPlancherAbsolu) / gfEff) * 100; // positif = marge de manœuvre sous GF, négatif = encore au-dessus
  }
  return { achat, prixPlancherAbsolu, floorPct, gfEff, sousGF, ecart, competitorLabel: comp.label };
}

function calibresDiffer(p) {
  return !!(p.monoprix.calibre && p.grandfrais.calibre && p.monoprix.calibre !== p.grandfrais.calibre);
}

const LEVERS = [
  "Réduire la démarque et la casse sur le frais (rotation, contrôle des dates)",
  "Mettre en tête de gondole ou en zone chaude les produits où l'écart est faible",
  "Utiliser le budget promo local (ILV, offre ponctuelle) sur les produits les plus comparés",
  "Soigner la présentation et la fraîcheur perçue pour justifier l'écart aux yeux du client",
  "Constituer un dossier chiffré à remonter aux achats / category manager",
];

function exportPdf(mode) {
  printMode = mode;
  document.getElementById("root").className = mode === "prices" ? "prices-only" : "";
  setTimeout(() => window.print(), 50);
}

function removeProduct(id) {
  products = products.filter(p => p.id !== id);
  save();
  render();
}

function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

// Simulateur de volume : calcule le prix nécessaire pour un volume visé,
// ou le volume nécessaire pour un prix candidat, à bénéfice total égal.
function simulatePrice(productId, achat, profitActuel) {
  const volActuel = num(val(`sim-vol-actuel-${productId}`)) || 1;
  const volVise = num(val(`sim-vol-vise-${productId}`));
  const resultEl = document.getElementById(`sim-result-price-${productId}`);
  if (!resultEl) return;
  if (volVise === null || volVise <= 0) { resultEl.innerHTML = ""; return; }
  const totalProfit = profitActuel * volActuel;
  const neededPrice = achat + (totalProfit / volVise);
  const marginPct = neededPrice > 0 ? ((neededPrice - achat) / neededPrice) * 100 : null;
  resultEl.innerHTML = `Prix nécessaire pour ${volVise} unité(s) : <b>${euro(neededPrice)}</b>${marginPct !== null ? ` (marge ${pct(marginPct)})` : ""}`;
}

function simulateVolume(productId, achat, profitActuel) {
  const volActuel = num(val(`sim-vol-actuel-${productId}`)) || 1;
  const prixCandidat = num(val(`sim-prix-candidat-${productId}`));
  const resultEl = document.getElementById(`sim-result-vol-${productId}`);
  if (!resultEl) return;
  if (prixCandidat === null) { resultEl.innerHTML = ""; return; }
  if (prixCandidat <= achat) {
    resultEl.innerHTML = `<span style="color:var(--warn);">Ce prix est inférieur ou égal au prix d'achat (${euro(achat)}) — aucun volume ne compensera, c'est une vente à perte.</span>`;
    return;
  }
  const totalProfit = profitActuel * volActuel;
  const profitParUnite = prixCandidat - achat;
  const volNecessaire = Math.ceil(totalProfit / profitParUnite);
  resultEl.innerHTML = `Volume nécessaire à ${euro(prixCandidat)} : <b>${volNecessaire} unité(s)</b> pour égaler le bénéfice actuel.`;
}

// Simulateur de stock promo : estime combien d'unités supplémentaires acheter
// pendant une promo pour maintenir le prix bas après la fin de la promo,
// sans risquer la démarque (produit périmé avant d'être vendu).
// Hypothèse prudente : on suppose le pire cas (achat le 1er jour de la promo),
// donc le stock supplémentaire ne peut compter que sur (conservation - durée promo)
// jours pour s'écouler après la fin de la promo.
function simulateStockPromo(productId) {
  const venteJour = num(val(`sim-vente-jour-${productId}`));
  const dureePromo = num(val(`sim-duree-promo-${productId}`));
  const dureeConservation = num(val(`sim-duree-conservation-${productId}`));
  const margeSecuriteInput = num(val(`sim-marge-securite-${productId}`));
  const margeSecurite = margeSecuriteInput === null ? 15 : margeSecuriteInput;
  const resultEl = document.getElementById(`sim-result-stock-${productId}`);
  if (!resultEl) return;

  if (venteJour === null || venteJour <= 0 || dureePromo === null || dureePromo <= 0 || dureeConservation === null || dureeConservation <= 0) {
    resultEl.innerHTML = "";
    return;
  }

  const joursDisponiblesApresPromo = Math.max(0, dureeConservation - dureePromo);
  const stockSupplementaireBrut = joursDisponiblesApresPromo * venteJour;
  const stockSupplementaire = Math.floor(stockSupplementaireBrut * (1 - margeSecurite / 100));
  const besoinNormalPromo = Math.ceil(venteJour * dureePromo);
  const totalACommander = besoinNormalPromo + stockSupplementaire;

  if (dureeConservation <= dureePromo) {
    resultEl.innerHTML = `<span style="color:var(--warn);">Attention : la durée de conservation (${dureeConservation}j) est trop courte par rapport à la promo (${dureePromo}j). Aucun stock supplémentaire ne peut être acheté sans risque de démarque — commande juste ce qu'il faut pour la promo (${besoinNormalPromo} unité(s)).</span>`;
    return;
  }

  resultEl.innerHTML = `
    <div>Commande normale pour la promo : <b>${besoinNormalPromo} unité(s)</b></div>
    <div>Stock supplémentaire prudent : <b>${stockSupplementaire} unité(s)</b> (marge de sécurité ${margeSecurite}%)</div>
    <div style="margin-top:4px;">Total à commander : <b>${totalACommander} unité(s)</b></div>

}

function logChange(productName, storeLabel, oldVal, newVal) {
  if (!oldVal && !newVal) return;
  if (String(oldVal || "") === String(newVal || "")) return;
  priceHistory.unshift({
    date: new Date().toISOString(),
    productName, storeLabel,
    ancien: oldVal || "—", nouveau: newVal || "—",
  });
  if (priceHistory.length > 100) priceHistory = priceHistory.slice(0, 100);
}

function addProduct() {
  const name = selectValue("f", "name").trim();
  const achat = val("f-achat");
  const mpPrix = val("f-mp-prix");
  const gfPrix = val("f-gf-prix");
  if (!name || !achat || !mpPrix || !gfPrix) return;

  const monoprix = defaultStore(mpPrix, val("f-mp-promo"), selectValue("f-mp", "calibre"), selectValue("f-mp", "origine"), val("f-mp-unit"));
  const grandfrais = defaultStore(gfPrix, val("f-gf-promo"), selectValue("f-gf", "calibre"), selectValue("f-gf", "origine"), val("f-gf-unit"));
  const categorie = val("f-categorie") || "Autre";
  const store3 = store3Name
    ? defaultStore(val("f-s3-prix"), val("f-s3-promo"), selectValue("f-s3", "calibre"), selectValue("f-s3", "origine"), val("f-s3-unit"))
    : null;

  if (editingId !== null) {
    const idx = products.findIndex(p => p.id === editingId);
    if (idx !== -1) {
      const old = products[idx];
      logChange(name, "Achat", old.achat, achat);
      logChange(name, "Monoprix (prix)", old.monoprix.prix, monoprix.prix);
      logChange(name, "Monoprix (promo)", old.monoprix.promo, monoprix.promo);
      logChange(name, "Grand Frais (prix)", old.grandfrais.prix, grandfrais.prix);
      logChange(name, "Grand Frais (promo)", old.grandfrais.promo, grandfrais.promo);
      if (store3) logChange(name, `${store3Name} (prix)`, old.store3 ? old.store3.prix : "", store3.prix);
      products[idx] = { id: editingId, name, achat, monoprix, grandfrais, categorie, store3: store3 || old.store3 || null };
    }
    editingId = null;
  } else {
    products.push({ id: Date.now(), name, achat, monoprix, grandfrais, categorie, store3 });
  }
  touchLastEdit();
  save();
  render();
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Verrouillage par code PIN — protection légère côté client (dissuasive,
// pas un vrai chiffrement) pour éviter qu'un tiers ouvre l'appli directement.
function simpleHash(s) { return btoa(unescape(encodeURIComponent(s))); }

function renderLockScreen() {
  document.getElementById("root").innerHTML = `
    <div style="max-width:300px;margin:90px auto 0;text-align:center;">
      <div class="brand-name" style="margin-bottom:6px;">Comparateur verrouillé</div>

      <input type="text" id="pin-input" inputmode="numeric" placeholder="Code PIN" style="text-align:center;letter-spacing:4px;font-size:18px;margin-bottom:10px;" />
      <div class="note" id="pin-error" style="color:var(--warn);min-height:16px;margin-bottom:10px;"></div>
      <button class="btn btn-primary" onclick="tryUnlock()">Déverrouiller</button>
    </div>`;
  const input = document.getElementById("pin-input");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
}

function tryUnlock() {
  const entered = val("pin-input");
  if (simpleHash(entered) === pinHash) {
    unlocked = true;
    render();
  } else {
    const err = document.getElementById("pin-error");
    if (err) err.textContent = "Code incorrect.";
  }
}

function setPin() {
  const p1 = prompt("Choisis un code PIN (4 caractères minimum) :");
  if (!p1) return;
  if (p1.length < 4) { alert("Le code doit faire au moins 4 caractères."); return; }
  const p2 = prompt("Confirme le code :");
  if (p1 !== p2) { alert("Les codes ne correspondent pas."); return; }
  pinHash = simpleHash(p1);
  localStorage.setItem("cp_pin_v1", pinHash);
  alert("Code PIN activé. Il sera demandé à la prochaine ouverture de l'appli.");
}

function removePin() {
  const p1 = prompt("Entre ton code PIN actuel pour le supprimer :");
  if (p1 === null) return;
  if (simpleHash(p1) !== pinHash) { alert("Code incorrect."); return; }
  pinHash = null;
  localStorage.removeItem("cp_pin_v1");
  alert("Code PIN supprimé.");
}

// Rapport de synthèse : compile les KPI, priorités et changements de prix
// depuis le dernier rapport généré, en fichier texte téléchargeable.
function generateReport() {
  const lastReportKey = "cp_last_report_v1";
  const sinceStr = localStorage.getItem(lastReportKey);
  const sinceDate = sinceStr ? new Date(sinceStr) : null;
  const changesSince = sinceDate ? priceHistory.filter(h => new Date(h.date) > sinceDate) : priceHistory;

  const analyses = lastAnalyses.length ? lastAnalyses : products.map(p => ({ ...p, a: computeAnalysis(p, num(minMargin) ?? 15) }));
  const priority = analyses
    .filter(p => p.a && p.a.ecartVsGF !== null && p.a.ecartVsGF > 0)
    .sort((x, y) => y.a.ecartVsGF - x.a.ecartVsGF)
    .slice(0, 5);
  const validGaps = analyses.filter(p => p.a && p.a.ecartVsGF !== null).map(p => p.a.ecartVsGF);
  const avgGap = validGaps.length ? validGaps.reduce((s, v) => s + v, 0) / validGaps.length : null;

  const lines = [];
  lines.push("RAPPORT DE SYNTHÈSE — Comparateur de prix");
  lines.push(`Généré le ${new Date().toLocaleDateString("fr-FR")} à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`);
  lines.push(sinceDate ? `Période couverte : depuis le ${sinceDate.toLocaleDateString("fr-FR")}` : "Première synthèse (aucun rapport précédent)");
  lines.push("");
  lines.push(`Produits suivis : ${analyses.length}`);
  lines.push(`Écart moyen vs ${store3Name ? "concurrence" : "Grand Frais"} : ${avgGap === null ? "—" : pct(avgGap)}`);
  lines.push(`Produits à traiter en priorité : ${priority.length}`);
  lines.push("");
  lines.push("TOP PRIORITÉS :");
  if (priority.length === 0) lines.push("- Aucun produit prioritaire actuellement.");
  priority.forEach((p, i) => lines.push(`${i + 1}. ${p.name} — écart ${pct(p.a.ecartVsGF)} — objectif ${euro(p.a.prixConseille)}`));
  lines.push("");
  lines.push(`CHANGEMENTS DE PRIX ENREGISTRÉS (${changesSince.length}) :`);
  if (changesSince.length === 0) lines.push("- Aucun changement enregistré sur la période.");
  changesSince.slice(0, 40).forEach(h => lines.push(`- ${new Date(h.date).toLocaleDateString("fr-FR")} : ${h.productName} (${h.storeLabel}) ${h.ancien} → ${h.nouveau}`));

  downloadBlob(lines.join("\n"), `rapport-comparateur-${new Date().toISOString().slice(0,10)}.txt`, "text/plain;charset=utf-8;");
  localStorage.setItem(lastReportKey, new Date().toISOString());
}

function importDataJson(fileInput) {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.products)) throw new Error("format invalide");
      const ok = window.confirm(`Importer ${data.products.length} produit(s) ? Cela remplacera tes données actuelles.`);
      if (!ok) return;
      products = data.products;
      if (data.minMargin) minMargin = data.minMargin;
      if (data.floorMargin) floorMargin = data.floorMargin;
      if (Array.isArray(data.priceHistory)) priceHistory = data.priceHistory;
      save();
      render();
    } catch (e) {
      alert("Fichier invalide, impossible d'importer ces données.");
    }
    fileInput.value = "";
  };
  reader.readAsText(file);
}

function csvField(v) {
  return `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;

function exportCsv(analyses) {
  const rows = [[
    "Produit","Catégorie","Achat","Monoprix prix","Monoprix promo","Monoprix calibre","Monoprix origine","Monoprix unité",
    "Grand Frais prix","Grand Frais promo","Grand Frais calibre","Grand Frais origine","Grand Frais unité",
    ...(store3Name ? [`${store3Name} prix`, `${store3Name} promo`, `${store3Name} calibre`, `${store3Name} origine`, `${store3Name} unité`] : []),
    "Marge actuelle (%)","Écart vs concurrent le moins cher (%)","Prix conseillé","Marge conseillée (%)"
  ]];
  analyses.forEach(p => {
    const a = p.a;
    const row = [
      p.name, getCategorie(p), p.achat,
      p.monoprix.prix, p.monoprix.promo, p.monoprix.calibre, p.monoprix.origine, unitLabel(p.monoprix.unit),
      p.grandfrais.prix, p.grandfrais.promo, p.grandfrais.calibre, p.grandfrais.origine, unitLabel(p.grandfrais.unit),
    ];
    if (store3Name) {
      const s3 = getStore3(p);
      row.push(s3.prix, s3.promo, s3.calibre, s3.origine, unitLabel(s3.unit));
    }
    row.push(
      a ? a.margeActuelle.toFixed(1).replace(".", ",") : "",
      a && a.ecartVsGF !== null ? a.ecartVsGF.toFixed(1).replace(".", ",") : "",
      a ? euro(a.prixConseille) : "",
      a && a.margeConseillee !== null ? a.margeConseillee.toFixed(1).replace(".", ",") : "",
    );
    rows.push(row);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(csvField).join(";")).join("\r\n");
  downloadBlob(csv, `comparateur-prix-${new Date().toISOString().slice(0,10)}.csv`, "text/csv;charset=utf-8;");
}

function filterSortAnalyses(analyses) {
  let list = analyses;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q));
  }
  if (categoryFilter) {
    list = list.filter(p => getCategorie(p) === categoryFilter);
  }
  list = [...list];
  if (sortMode === "gap") {
    list.sort((x, y) => {
      const gx = x.a && x.a.ecartVsGF !== null ? x.a.ecartVsGF : -Infinity;
      const gy = y.a && y.a.ecartVsGF !== null ? y.a.ecartVsGF : -Infinity;
      return gy - gx;
    });
  } else if (sortMode === "margin") {
    list.sort((x, y) => {
      const mx = x.a ? x.a.margeActuelle : Infinity;
      const my = y.a ? y.a.margeActuelle : Infinity;
      return mx - my;
    });
  } else {
    list.sort((x, y) => x.name.localeCompare(y.name, "fr"));
  }
  return list;
}

        <label class="small" style="display:flex;align-items:center;gap:5px;">
          <input type="checkbox" id="${prefix}-promo-toggle" onchange="onPromoToggle(this, '${prefix}-promo')" style="width:auto;" ${s.promo ? "checked" : ""} />
          En promo
        </label>
      </div>
    </div>
    <input type="text" id="${prefix}-promo" value="${s.promo || ""}" placeholder="Prix promo (€)" inputmode="decimal" style="display:${s.promo ? "block" : "none"};margin-top:8px;" />
    <div class="row" style="margin-top:8px;">
      <div class="field">
        <label class="small">Origine</label>
        <select id="${prefix}-origine-select" onchange="onSelectChange(this, '${prefix}-origine-custom')">
          <option value="" ${origineSelectVal === "" ? "selected" : ""}>—</option>
          ${optionsHtml(ORIGINES, origineSelectVal)}
        </select>
        <input type="text" id="${prefix}-origine-custom" value="${origineCustomVal}" placeholder="Préciser le pays" style="display:${origineCustomVal ? "block" : "none"};margin-top:6px;" />
      </div>
      <div class="field">
        <label class="small">Calibre</label>
        <select id="${prefix}-calibre-select" onchange="onSelectChange(this, '${prefix}-calibre-custom')">
          <option value="" ${calibreSelectVal === "" ? "selected" : ""}>—</option>
          ${optionsHtml(CALIBRES, calibreSelectVal)}
        </select>
        <input type="text" id="${prefix}-calibre-custom" value="${calibreCustomVal}" placeholder="Préciser le calibre" style="display:${calibreCustomVal ? "block" : "none"};margin-top:6px;" />
      </div>
      <div class="field" style="flex:0 0 90px;">
        <label class="small">Vendu</label>
        <select id="${prefix}-unit">
          <option value="piece" ${s.unit !== "kg" ? "selected" : ""}>pièce</option>
          <option value="kg" ${s.unit === "kg" ? "selected" : ""}>kg</option>
        </select>
      </div>
    </div>
  </div>`;
}

function render() {
  if (pinHash && !unlocked) { renderLockScreen(); return; }

  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;
  const selStart = activeId && typeof activeEl.selectionStart === "number" ? activeEl.selectionStart : null;
  const selEnd = activeId && typeof activeEl.selectionEnd === "number" ? activeEl.selectionEnd : null;

  const minMarginNum = num(minMargin) ?? 15;
  const floorMarginNum = num(floorMargin) ?? 3;
  const analyses = products.map(p => ({ ...p, a: computeAnalysis(p, minMarginNum), f: computeFloorAnalysis(p, floorMarginNum) }));
  lastAnalyses = analyses;
  const visibleAnalyses = filterSortAnalyses(analyses);
  const priorityProducts = analyses
    .filter(p => p.a && p.a.ecartVsGF !== null && p.a.ecartVsGF > 0)
    .sort((x, y) => y.a.ecartVsGF - x.a.ecartVsGF)
    .slice(0, 3);
  const unreachableCount = analyses.filter(p => p.a && p.a.atteignable === false).length;

  const validGaps = analyses.filter(p => p.a && p.a.ecartVsGF !== null).map(p => p.a.ecartVsGF);
  const avgGap = validGaps.length ? validGaps.reduce((s, v) => s + v, 0) / validGaps.length : null;
  const validMargins = analyses.filter(p => p.a).map(p => p.a.margeActuelle);
  const avgMargin = validMargins.length ? validMargins.reduce((s, v) => s + v, 0) / validMargins.length : null;
  const priorityCount = analyses.filter(p => p.a && p.a.ecartVsGF !== null && p.a.ecartVsGF > 0).length;

  let html = "";

  html += `<div class="topbar">
    <div>
      <div class="brand-name">Comparateur de prix — Rayon</div>
      <div class="brand-sub hide-in-prices-only">Monoprix vs Grand Frais${store3Name ? " vs " + store3Name : ""} · suivi de compétitivité</div>
    </div>
    <div class="export-col no-print">
      <button class="btn" onclick="exportPdf('full')">Export PDF complet</button>
      <button class="btn" onclick="exportPdf('prices')">Export PDF (prix)</button>
      <button class="btn" onclick="exportCsv(lastAnalyses)">Export Excel (CSV)</button>
    </div>
  </div>`;

  if (!reminderDismissed) {
    const daysSince = Math.floor((Date.now() - new Date(lastEditDate).getTime()) / 86400000);
    if (daysSince >= 7) {
      html += `<div class="reminder-banner no-print">
        <span>Ça fait ${daysSince} jours que les prix n'ont pas été mis à jour. Pense à les vérifier en magasin.</span>
        <div class="actions">
          <button class="btn" onclick="markPricesUpdated()">Prix vérifiés</button>
          <button class="btn" onclick="dismissReminder()">Fermer</button>
        </div>
      </div>`;
    }
  }

  html += `<div class="row no-print" style="gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
    <button class="btn" onclick="exportDataJson()">Sauvegarder mes données</button>
    <button class="btn" onclick="triggerImport()">Importer une sauvegarde</button>
    <input type="file" id="import-file-input" accept="application/json" style="display:none;" onchange="importDataJson(this)" />
    <button class="btn" onclick="generateReport()">Générer un rapport</button>
    ${pinHash ? `<button class="btn" onclick="removePin()">Supprimer le code PIN</button>` : `<button class="btn" onclick="setPin()">Définir un code PIN</button>`}
  </div>
  <div class="row no-print" style="gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;">
    ${syncId ? `
      <button class="btn" onclick="manualSync()">Synchroniser maintenant</button>
      <button class="btn" onclick="disableSync()">Désactiver la synchro</button>
      <span class="note">${syncStatus === "syncing" ? "Synchronisation..." : syncStatus === "ok" ? "☁️ Synchronisé" : syncStatus === "error" ? "⚠️ Erreur de synchro" : ""}</span>
    ` : `<button class="btn" onclick="configureSync()">Synchroniser entre appareils</button>`}
  </div>`;

  html += `<div class="kpi-grid hide-in-prices-only">
    <div class="kpi"><div class="kpi-label">Produits suivis</div><div class="kpi-value">${analyses.length}</div></div>
    <div class="kpi"><div class="kpi-label">Écart moyen vs ${store3Name ? "concurrence" : "Grand Frais"}</div><div class="kpi-value ${avgGap !== null && avgGap > 0 ? "warn" : "good"}">${avgGap === null ? "—" : (avgGap > 0 ? "+" : "") + pct(avgGap)}</div></div>
    <div class="kpi"><div class="kpi-label">À traiter en priorité</div><div class="kpi-value ${priorityCount > 0 ? "warn" : "good"}">${priorityCount}</div></div>
    <div class="kpi"><div class="kpi-label">Marge moyenne actuelle</div><div class="kpi-value">${avgMargin === null ? "—" : pct(avgMargin)}</div></div>
  </div>`;

  const chartData = analyses.filter(p => p.a && p.a.ecartVsGF !== null).sort((x, y) => Math.abs(y.a.ecartVsGF) - Math.abs(x.a.ecartVsGF)).slice(0, 8);
  if (chartData.length > 0) {
    const maxAbs = Math.max(5, ...chartData.map(p => Math.abs(p.a.ecartVsGF)));
    html += `<div class="section-title hide-in-prices-only">Écarts de prix par produit</div>
    <div class="card hide-in-prices-only" style="margin-bottom:22px;">`;
    chartData.forEach(p => {
      const gap = p.a.ecartVsGF;
      const widthPct = Math.min(100, (Math.abs(gap) / maxAbs) * 100);
      const color = gap > 0 ? "var(--warn)" : "var(--gf)";
      html += `<div class="chart-row">
        <div class="chart-label">${p.name}</div>
        <div class="chart-bar-wrap"><div class="chart-bar" style="width:${widthPct}%;background:${color};"></div></div>
        <div class="chart-val" style="color:${color};">${gap > 0 ? "+" : ""}${pct(gap)}</div>
      </div>`;
    });
    html += `<div class="note" style="margin-top:6px;">Rouge = Monoprix plus cher · Vert = Monoprix moins cher</div></div>`;
  }

  html += `<div class="row no-print" style="align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
    <label style="font-size:13px;color:var(--muted);">Comparer aussi avec (optionnel)</label>
    <input type="text" id="store3-name-input" value="${store3Name}" oninput="onStore3NameChange(this.value)" placeholder="ex. Carrefour" style="width:140px;" />
  </div>`;

  html += `<div class="section-title">Grille de prix par enseigne</div>
  <div class="row no-print" style="gap:10px;margin-bottom:10px;flex-wrap:wrap;">
    <div class="field" style="flex:1 1 160px;"><input type="text" id="search-input" value="${searchQuery}" oninput="onSearchChange(this.value)" placeholder="Rechercher un produit..." /></div>
    <div class="field" style="flex:0 0 170px;">
      <select onchange="onSortChange(this.value)">
        <option value="name" ${sortMode === "name" ? "selected" : ""}>Trier : Nom (A→Z)</option>
        <option value="gap" ${sortMode === "gap" ? "selected" : ""}>Trier : Écart le plus grand</option>
        <option value="margin" ${sortMode === "margin" ? "selected" : ""}>Trier : Marge la plus faible</option>
      </select>
    </div>
    <div class="field" style="flex:0 0 170px;">
      <select onchange="onCategoryFilterChange(this.value)">
        <option value="" ${categoryFilter === "" ? "selected" : ""}>Toutes les catégories</option>
        ${CATEGORIES.map(c => `<option value="${c}" ${categoryFilter === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
    </div>
  </div>
  <div class="price-table">
    <div class="price-row header no-print">
      <div class="col-name">Produit</div>
      <div class="col-price" style="text-align:right;">Monoprix</div>
      <div class="col-price" style="text-align:right;">Grand Frais</div>
      ${store3Name ? `<div class="col-price" style="text-align:right;">${store3Name}</div>` : ""}
    </div>`;
  if (visibleAnalyses.length === 0) {
    html += `<div class="note" style="text-align:center;padding:20px 0;">${analyses.length === 0 ? "Ajoute un produit ci-dessous." : "Aucun produit ne correspond à ta recherche."}</div>`;
  }
  visibleAnalyses.forEach(p => {
    const prices = [
      { key: "monoprix", val: effectivePrice(p.monoprix) },
      { key: "grandfrais", val: effectivePrice(p.grandfrais) },
    ];
    if (store3Name) prices.push({ key: "store3", val: effectivePrice(getStore3(p)) });
    const validPrices = prices.filter(x => x.val !== null && x.val > 0);
    const minVal = validPrices.length ? Math.min(...validPrices.map(x => x.val)) : null;
    const winners = minVal !== null ? validPrices.filter(x => x.val === minVal).map(x => x.key) : [];
    const isWinner = key => winners.length === 1 && winners[0] === key;
    html += `<div class="price-row">
      <div class="col-name">
        <div class="pname">${p.name}</div>
        <div class="meta-tags">
          <span class="meta-tag">${getCategorie(p)}</span>
          ${calibresDiffer(p) ? `<span class="meta-tag warn">Calibres différents</span>` : ""}
        </div>
      </div>
      ${priceCellHtml(p.monoprix, isWinner("monoprix"))}
      ${priceCellHtml(p.grandfrais, isWinner("grandfrais"))}
      ${store3Name ? priceCellHtml(getStore3(p), isWinner("store3")) : ""}
    </div>`;
  });
  html += `</div>`;

  html += `<div class="row no-print" style="align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
    <label style="font-size:13px;color:var(--muted);">Marge confortable à conserver</label>
    <input type="text" id="margin-input" value="${minMargin}" oninput="onMarginChange(this.value)" style="width:56px;text-align:center;padding:6px 8px;" />
    <span style="font-size:13px;color:var(--muted);">%</span>
  </div>
  <div class="row no-print" style="align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
    <label style="font-size:13px;color:var(--muted);">Marge plancher absolue (minimum vital)</label>
    <input type="text" id="floor-margin-input" value="${floorMargin}" oninput="onFloorMarginChange(this.value)" style="width:56px;text-align:center;padding:6px 8px;" />
    <span style="font-size:13px;color:var(--muted);">%</span>
  </div>`;

  const editingProduct = editingId !== null ? products.find(p => p.id === editingId) : null;

  html += `<div id="product-form-panel">
  <div class="section-title no-print">${editingProduct ? "Modifier le produit" : "Ajouter un produit"}</div>
  <div class="card no-print" style="margin-bottom:24px;">
    <div class="row" style="flex-direction:column;gap:10px;">
      ${nameFieldHtml(editingProduct ? editingProduct.name : "")}
      <div class="field">
        <label class="small">Catégorie</label>
        <select id="f-categorie">
          ${CATEGORIES.map(c => `<option value="${c}" ${(editingProduct ? getCategorie(editingProduct) : "Autre") === c ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label class="small" style="color:var(--tag);">Prix d'achat (€)</label><input type="text" id="f-achat" value="${editingProduct ? editingProduct.achat : ""}" placeholder="0.00" inputmode="decimal" /></div>
      ${storeFormBlock("f-mp", "Monoprix", "var(--mono)", editingProduct ? editingProduct.monoprix : null)}
      ${storeFormBlock("f-gf", "Grand Frais", "var(--gf)", editingProduct ? editingProduct.grandfrais : null)}
      ${store3Name ? storeFormBlock("f-s3", store3Name, "var(--accent)", editingProduct ? editingProduct.store3 : null) : ""}
      <div class="row">
        <button class="btn btn-primary" onclick="addProduct()">${editingProduct ? "Enregistrer les modifications" : "Ajouter le produit"}</button>
        ${editingProduct ? `<button class="btn" style="flex:0 0 100px;" onclick="cancelEdit()">Annuler</button>` : ""}
      </div>
    </div>
  </div>
  </div>`;

  html += `<div class="section-title hide-in-prices-only">Analyse détaillée</div>
  <div class="hide-in-prices-only">`;
  visibleAnalyses.forEach(p => {
    const a = p.a;
    const f = p.f;
    const statusClass = a && a.ecartVsGF !== null ? (a.ecartVsGF > 0 ? "status-warn" : "status-ok") : "";
    html += `<div class="prod-card ${statusClass}">
      <div class="prod-top">
        <div style="font-size:14.5px;font-weight:700;">${p.name}</div>
        <div class="row no-print" style="gap:6px;">
          <button class="del" onclick="editProduct(${p.id})">Modifier</button>
          <button class="del" onclick="removeProduct(${p.id})">Supprimer</button>
        </div>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:20px;">
        <div class="stat-block">
          <div class="stat-lbl" style="color:var(--mono);">Monoprix</div>
          <div class="stat-val">${isOnPromo(p.monoprix) ? `<span class="old-price">${euro(p.monoprix.prix)}</span>${euro(p.monoprix.promo)}` : euro(p.monoprix.prix)}<span class="unit-suffix">${unitLabel(p.monoprix.unit)}</span></div>
          ${storeTagsHtml(p.monoprix)}
        </div>
        <div class="stat-block">
          <div class="stat-lbl" style="color:var(--gf);">Grand Frais</div>
          <div class="stat-val">${isOnPromo(p.grandfrais) ? `<span class="old-price">${euro(p.grandfrais.prix)}</span>${euro(p.grandfrais.promo)}` : euro(p.grandfrais.prix)}<span class="unit-suffix">${unitLabel(p.grandfrais.unit)}</span></div>
          ${storeTagsHtml(p.grandfrais)}
        </div>
        ${store3Name ? `<div class="stat-block">
          <div class="stat-lbl" style="color:var(--accent);">${store3Name}</div>
          <div class="stat-val">${isOnPromo(getStore3(p)) ? `<span class="old-price">${euro(getStore3(p).prix)}</span>${euro(getStore3(p).promo)}` : euro(getStore3(p).prix)}<span class="unit-suffix">${unitLabel(getStore3(p).unit)}</span></div>
          ${storeTagsHtml(getStore3(p))}
        </div>` : ""}
        <div class="stat-block">
          <div class="stat-lbl" style="color:var(--tag);">Achat</div>
          <div class="stat-val">${euro(p.achat)}</div>
        </div>
        ${a ? `<div class="stat-block" style="margin-left:auto;"><div class="stat-lbl">Marge actuelle</div><div class="stat-val">${pct(a.margeActuelle)}</div></div>` : ""}
      </div>
      ${a && a.ecartVsGF !== null ? `
      <div class="analysis">
        <div class="title" style="color:${a.atteignable ? "var(--gf)" : "var(--warn)"};">Prix conseillé (marge confortable) : ${euro(a.prixConseille)}${unitLabel(p.monoprix.unit)}</div>
        <div class="note">${a.atteignable
          ? `Alignement possible sur ${a.competitorLabel} (prix réellement appliqué, promo comprise) en gardant une marge de ${pct(a.margeConseillee)}.`
          : `Impossible d'égaler ${a.competitorLabel} (${euro(a.gfEff)}, promo comprise) sans passer sous ${minMarginNum}% de marge. À ${euro(a.prixConseille)}, il reste ${pct(((a.prixConseille - a.gfEff) / a.prixConseille) * 100)} plus cher.`}</div>
      </div>` : ""}
      ${f ? `
      <div class="analysis">
        <div class="title" style="color:${f.sousGF ? "var(--gf)" : "var(--warn)"};">Prix plancher absolu (marge minimale ${floorMarginNum}%) : ${euro(f.prixPlancherAbsolu)}${unitLabel(p.monoprix.unit)}</div>
        <div class="note">${f.gfEff === null ? `Renseigne le prix ${f.competitorLabel} pour comparer.`
          : f.sousGF
            ? `Prix le plus bas possible sans perte. Il reste ${pct(f.ecart)} en dessous de ${f.competitorLabel} — marge de manœuvre disponible pour baisser davantage si besoin.`
            : `Même à cette marge minimale de ${floorMarginNum}%, ce prix reste ${pct(-f.ecart)} au-dessus de ${f.competitorLabel} — impossible de passer sous leur prix sans vendre à perte.`}</div>
      </div>` : ""}
      ${calibresDiffer(p) ? `
      <div class="analysis">
        <div class="title" style="color:var(--warn);">Calibres différents</div>
        <div class="note">Monoprix : ${p.monoprix.calibre} — Grand Frais : ${p.grandfrais.calibre}. Comparaison à nuancer : un calibre plus gros justifie en partie un prix plus élevé.</div>
      </div>` : ""}
      ${a ? `
      <div class="analysis no-print">
        <div class="title">Simulateur de volume</div>

          <div class="field" style="flex:0 0 150px;">
            <label class="small">Volume actuel (unités)</label>
            <input type="text" id="sim-vol-actuel-${p.id}" value="1" inputmode="numeric"
              oninput="simulatePrice(${p.id}, ${a.achat}, ${a.venteEff - a.achat}); simulateVolume(${p.id}, ${a.achat}, ${a.venteEff - a.achat})" />
          </div>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap;">
          <div class="field">
            <label class="small">Volume visé (unités)</label>
            <input type="text" id="sim-vol-vise-${p.id}" placeholder="ex. 10" inputmode="numeric"
              oninput="simulatePrice(${p.id}, ${a.achat}, ${a.venteEff - a.achat})" />
          </div>
        </div>
        <div class="note" id="sim-result-price-${p.id}" style="margin:6px 0 12px;"></div>
        <div class="row" style="gap:8px;flex-wrap:wrap;">
          <div class="field">
            <label class="small">Ou prix candidat (€)</label>
            <input type="text" id="sim-prix-candidat-${p.id}" placeholder="0.00" inputmode="decimal"
              oninput="simulateVolume(${p.id}, ${a.achat}, ${a.venteEff - a.achat})" />
          </div>
        </div>
        <div class="note" id="sim-result-vol-${p.id}" style="margin-top:6px;"></div>
      </div>` : ""}
      ${a ? `
      <div class="analysis no-print">
        <div class="title">Simulateur de stock promo</div>
        <div class="note" style="margin-bottom:8px;">Estime combien de cartons supplémentaires acheter pendant une promo pour garder le prix bas après, sans risquer la démarque.</div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <div class="field" style="flex:0 0 140px;"><label class="small">Vente/jour (unités)</label><input type="text" id="sim-vente-jour-${p.id}" placeholder="ex. 1" inputmode="numeric" oninput="simulateStockPromo(${p.id})" /></div>
          <div class="field" style="flex:0 0 140px;"><label class="small">Durée promo (jours)</label><input type="text" id="sim-duree-promo-${p.id}" placeholder="ex. 5" inputmode="numeric" oninput="simulateStockPromo(${p.id})" /></div>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:4px;">
          <div class="field" style="flex:0 0 160px;">
            <label class="small">Conservation produit (jours)</label>
            <input type="text" id="sim-duree-conservation-${p.id}" value="${PRODUITS_CONSERVATION[p.name] ? PRODUITS_CONSERVATION[p.name].jours : ""}" placeholder="ex. 10" inputmode="numeric" oninput="simulateStockPromo(${p.id})" />
          </div>
          <div class="field" style="flex:0 0 140px;"><label class="small">Marge de sécurité (%)</label><input type="text" id="sim-marge-securite-${p.id}" value="15" inputmode="numeric" oninput="simulateStockPromo(${p.id})" /></div>
        </div>
        ${PRODUITS_CONSERVATION[p.name] ? `<div class="note" style="margin-bottom:8px;">Référence pour "${p.name}" : ${PRODUITS_CONSERVATION[p.name].jours} jours à ${PRODUITS_CONSERVATION[p.name].temp} — à ajuster selon la fraîcheur réelle à réception.</div>` : ""}
        <div class="note" id="sim-result-stock-${p.id}"></div>
      </div>` : ""}
    </div>`;
  });
  html += `</div>`;

  if (priorityProducts.length > 0) {
    html += `<div class="section-title hide-in-prices-only">Recommandations</div>
    <div class="card hide-in-prices-only" style="margin-top:0;">
      <div class="note" style="margin-bottom:10px;">Produits à traiter en priorité (écart après promos) :</div>
      <ol class="priority-list">`;
    priorityProducts.forEach(p => {
      html += `<li><span>${p.name}</span><span style="color:${p.a.atteignable ? "var(--gf)" : "var(--warn)"};font-weight:700;">Objectif : ${euro(p.a.prixConseille)}${unitLabel(p.monoprix.unit)}${p.a.atteignable ? "" : " (marge min.)"}</span></li>`;
    });
    html += `</ol>`;
    if (unreachableCount > 0) {
      html += `<div class="warn-banner">${unreachableCount} produit(s) ne peuvent pas atteindre le prix Grand Frais sans passer sous la marge minimale — le levier est de renégocier le prix d'achat.</div>`;
    }
    html += `<div class="note" style="margin-bottom:8px;">Leviers activables à ton niveau (chef de rayon) :</div>
      <ul class="recos">${LEVERS.map(l => `<li>${l}</li>`).join("")}</ul>
    </div>`;
  }

  if (priceHistory.length > 0) {
    html += `<div class="section-title hide-in-prices-only" style="margin-top:22px;">Historique des prix</div>
    <div class="card hide-in-prices-only" style="margin-top:0;">
      <div class="note" style="margin-bottom:10px;">Derniers changements enregistrés :</div>`;
    priceHistory.slice(0, 15).forEach(h => {
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      html += `<div class="price-row" style="padding:8px 0;border-top:1px solid var(--border);">
        <div class="col-name">
          <div style="font-size:12.5px;color:var(--muted);">${dateStr}</div>
          <div class="pname" style="font-size:13px;">${h.productName} — ${h.storeLabel}</div>
        </div>
        <div style="font-size:13px;font-variant-numeric:tabular-nums;"><span class="old-price">${h.ancien}</span> → <b>${h.nouveau}</b></div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById("root").innerHTML = html;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

render();

if (firebaseConfig && syncId) {
  pullFromCloud();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
